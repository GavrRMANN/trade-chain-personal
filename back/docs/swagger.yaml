          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: Детали предложения, чат и состояние
      tags:
      - exchange-offers
  /exchange-offers/{offerID}/accept:
    post:
      description: |-
        Принять может только владелец запрошенного товара. Принятие
        создаёт обмен в состоянии awaiting_initiator и не меняет
        владение товарами — для этого нужны подтверждения обеих сторон.
