basePath: /
definitions:
  domain.Category:
    properties:
      category_id:
        type: string
      created_at:
        type: string
      name:
        type: string
      parent_id:
        type: string
      updated_at:
        type: string
    type: object
  domain.Chain:
    properties:
      chain_id:
        type: string
      created_at:
        type: string
      exchange_goal_id:
        type: string
      expires_at:
        type: string
      from_product_id:
        type: string
      initiator_id:
        type: string
      message:
        type: string
      next_chain_id:
        type: string
      previous_chain_id:
        type: string
      recipient_id:
        type: string
      route_step_id:
        type: string
      status:
        type: string
      surcharge:
        $ref: '#/definitions/domain.Surcharge'
      to_product_id:
        type: string
      updated_at:
        type: string
    type: object
  domain.ChainMessage:
    properties:
      body:
        type: string
      chain_id:
        type: string
      created_at:
        type: string
      customer_id:
        type: string
      message_id:
        type: string
    type: object
  domain.ChainStatus:
    enum:
    - pending
    - active
    - completed
    - cancelled
    - rejected
    - countered
    - failed
    - expired
    type: string
    x-enum-comments:
      ChainActive: получатель согласился, стороны договариваются
      ChainCancelled: инициатор отозвал предложение
      ChainCompleted: обмен состоялся, подтвердили оба
      ChainCountered: получатель предложил свой вариант
      ChainExpired: ответа не дождались
      ChainFailed: договорились, но обмен не состоялся
      ChainPending: предложение отправлено, ответа нет
      ChainRejected: получатель отказался
    x-enum-descriptions:
    - предложение отправлено, ответа нет
    - получатель согласился, стороны договариваются
    - обмен состоялся, подтвердили оба
    - инициатор отозвал предложение
    - получатель отказался
    - получатель предложил свой вариант
    - договорились, но обмен не состоялся
    - ответа не дождались
    x-enum-varnames:
    - ChainPending
    - ChainActive
    - ChainCompleted
    - ChainCancelled
    - ChainRejected
    - ChainCountered
    - ChainFailed
    - ChainExpired
  domain.CreateCustomerDTO:
    properties:
      email:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  domain.CreateProductDTO:
    properties:
      category_id:
        type: string
      customer_id:
        type: string
      description:
        type: string
      image:
        type: string
      location:
        type: string
      price:
        type: integer
      status:
        $ref: '#/definitions/domain.ProductStatus'
      title:
        type: string
    required:
    - customer_id
    - title
    type: object
  domain.Customer:
    properties:
      created_at:
        type: string
      customer_id:
        type: string
      email:
        type: string
      updated_at:
        type: string
    type: object
  domain.Product:
    properties:
      category_id:
        type: string
      created_at:
        type: string
      customer_id:
        type: string
      description:
        type: string
      image:
        type: string
      location:
        type: string
      price:
        type: integer
      product_id:
        type: string
      status:
        $ref: '#/definitions/domain.ProductStatus'
      title:
        type: string
      updated_at:
        type: string
    type: object
  domain.ProductStatus:
    enum:
    - active
    - reserved
    - exchanged
    - archived
    type: string
    x-enum-varnames:
    - ProductActive
    - ProductReserved
    - ProductExchanged
    - ProductArchived
  domain.Review:
    properties:
      chain_id:
        description: |-
          ChainID — сделка, по итогам которой оставлена оценка. Допускает NULL
          ради отзывов, заведённых до появления привязки.
        type: string
      comment:
        type: string
      created_at:
        type: string
      from_customer_id:
        type: string
      product_id:
        type: string
      rating:
        type: integer
      review_id:
        type: string
      to_customer_id:
        type: string
      updated_at:
        type: string
    type: object
  domain.Surcharge:
    properties:
      amount:
        type: integer
      currency:
        type: string
      payer:
        type: string
    type: object
  domain.UpdateCustomerDTO:
    properties:
      email:
        type: string
      password:
        minLength: 8
        type: string
    type: object
  domain.UpdateProductDTO:
    properties:
      category_id:
        type: string
      description:
        type: string
      image:
        type: string
      location:
        type: string
      price:
        type: integer
      status:
        $ref: '#/definitions/domain.ProductStatus'
      title:
        type: string
    type: object
  domain.Wishlist:
    properties:
      created_at:
        type: string
      name:
        type: string
      product_id:
        type: string
      updated_at:
        type: string
      wishlist_id:
        type: string
    type: object
  httpapi.AuthResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/domain.Customer'
    type: object
  httpapi.ChainStatusRequest:
    properties:
      status:
        $ref: '#/definitions/domain.ChainStatus'
    type: object
  httpapi.ConfirmExchangeRequest:
    properties:
      reason:
        type: string
      result:
        type: string
    type: object
  httpapi.ConfirmRequest:
    properties:
      success:
        type: boolean
    type: object
  httpapi.ConfirmationResponse:
    properties:
      created_at:
        type: string
      customer_id:
        type: string
      reason:
        type: string
      result:
        type: string
    type: object
  httpapi.CreateOfferRequest:
    properties:
      comment:
        type: string
      exchange_goal_id:
        type: string
      offered_product_id:
        type: string
      requested_product_id:
        type: string
      route_step_id:
        type: string
      surcharge:
        $ref: '#/definitions/httpapi.SurchargeBody'
    type: object
  httpapi.CreatedOfferResponse:
    properties:
      conversation_id:
        type: string
      expires_at:
        type: string
      id:
        type: string
      status:
        type: string
    type: object
  httpapi.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  httpapi.ExchangeResponse:
    properties:
      goal_id:
        type: string
      id:
        type: string
      offer_status:
        type: string
      offered_product_id:
        type: string
      requested_product_id:
        type: string
      status:
        type: string
    type: object
  httpapi.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  httpapi.MessageRequest:
    properties:
      body:
        type: string
    type: object
  httpapi.OfferDetailsResponse:
    properties:
      comment:
        type: string
      confirmations:
        items:
          $ref: '#/definitions/httpapi.ConfirmationResponse'
        type: array
      conversation_id:
        type: string
      created_at:
        type: string
      exchange_goal_id:
        type: string
      exchange_id:
        type: string
      exchange_status:
        type: string
      expires_at:
        type: string
      id:
        type: string
      initiator_id:
        type: string
      messages:
        items:
          $ref: '#/definitions/domain.ChainMessage'
        type: array
      offered_product_id:
        type: string
      recipient_id:
        type: string
      requested_product_id:
        type: string
      role:
        type: string
      route_step_id:
        type: string
      status:
        type: string
      surcharge:
        $ref: '#/definitions/httpapi.SurchargeBody'
      updated_at:
        type: string
    type: object
  httpapi.OfferResponse:
    properties:
      comment:
        type: string
      conversation_id:
        type: string
      created_at:
        type: string
      exchange_goal_id:
        type: string
      exchange_id:
        type: string
      exchange_status:
        type: string
      expires_at:
        type: string
      id:
        type: string
      initiator_id:
        type: string
      offered_product_id:
        type: string
      recipient_id:
        type: string
      requested_product_id:
        type: string
      role:
        type: string
      route_step_id:
        type: string
      status:
        type: string
      surcharge:
        $ref: '#/definitions/httpapi.SurchargeBody'
      updated_at:
        type: string
    type: object
  httpapi.OptionRequest:
    properties:
      category_id:
        type: string
    type: object
  httpapi.ReviewRequest:
    properties:
      chain_id:
        type: string
      comment:
        type: string
      product_id:
        type: string
      rating:
        type: integer
    type: object
  httpapi.SurchargeBody:
    properties:
      amount:
        type: integer
      currency:
        type: string
      payer:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: API для обмена товарами
  title: Trade Chain API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user and return JWT token
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httpapi.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: Login user
      tags:
      - auth
  /auth/me:
    get:
      consumes:
      - application/json
      description: Get information about the authenticated user (validates token)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Customer'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: Get current user info
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Register a new user and return JWT token
      parameters:
      - description: Registration data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.CreateCustomerDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/httpapi.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: Register user
      tags:
      - auth
  /categories:
    get:
      consumes:
      - application/json
      description: List all categories
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Category'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: List categories
      tags:
      - categories
    post:
      consumes:
      - application/json
      description: Create a new category
      parameters:
      - description: Category data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.Category'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Category'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: Create category
      tags:
      - categories
  /categories/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a category
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: Delete category
      tags:
      - categories
    get:
      consumes:
      - application/json
      description: Get category details
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Category'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: Get category by ID
      tags:
      - categories
    put:
      consumes:
      - application/json
      description: Update category information
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: string
      - description: Updated category data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.Category'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Category'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: Update category
      tags:
      - categories
  /categories/{id}/subcategories:
    get:
      consumes:
      - application/json
      description: Get subcategories of a category
      parameters:
      - description: Parent Category ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Category'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: Get subcategories
      tags:
      - categories
  /chains:
    post:
      consumes:
      - application/json
      description: Create a new exchange chain
      parameters:
      - description: Chain data (initiator_id will be set from token)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.Chain'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Chain'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: Create a chain
      tags:
      - chains
  /chains/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a chain (soft delete maybe, but hard delete in repo)
      parameters:
      - description: Chain ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: Delete chain
      tags:
      - chains
    get:
      consumes:
      - application/json
      description: Get chain details
      parameters:
      - description: Chain ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Chain'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: Get chain by ID
      tags:
      - chains
  /chains/{id}/confirm:
    post:
      consumes:
      - application/json
      description: |-
        Подтвердить итог обмена. Состоявшимся обмен считается только
        после подтверждения обеими сторонами; несостоявшимся — по
        заявлению одной.
      parameters:
      - description: Chain ID
        in: path
        name: id
        required: true
        type: string
      - description: Итог встречи
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httpapi.ConfirmRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Chain'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: Confirm exchange outcome
      tags:
      - chains
  /chains/{id}/full:
    get:
      consumes:
      - application/json
      description: Get full chain details (all linked chains)
      parameters:
      - description: Chain ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Chain'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: Get full chain
      tags:
      - chains
  /chains/{id}/messages:
    get:
      description: Переписка по сделке. Доступна только её участникам.
      parameters:
      - description: Chain ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.ChainMessage'
            type: array
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: Read exchange chat
      tags:
      - chains
    post:
      consumes:
      - application/json
      description: |-
        Написать второй стороне по этой сделке. По закрытой сделке
        переписка недоступна.
      parameters:
      - description: Chain ID
        in: path
        name: id
        required: true
        type: string
      - description: Текст сообщения
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httpapi.MessageRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.ChainMessage'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: Write to exchange chat
      tags:
      - chains
  /chains/{id}/status:
    patch:
      consumes:
      - application/json
      description: Update chain status (pending -> active -> completed, or cancelled/rejected)
      parameters:
      - description: Chain ID
        in: path
        name: id
        required: true
        type: string
      - description: New status
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httpapi.ChainStatusRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: Update chain status
      tags:
      - chains
  /chains/by-product/{productID}:
    get:
      consumes:
      - application/json
      description: Get chains associated with a product (either from or to)
      parameters:
      - description: Product ID
        in: path
        name: productID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Chain'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: Get chains by product
      tags:
      - chains
  /chains/my:
    get:
      description: 'Обмены пользователя: и предложенные им, и полученные'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Chain'
            type: array
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
