  /exchanges/{exchangeID}/confirm:
    post:
      consumes:
      - application/json
      description: |-
        Обмен считается состоявшимся только после двух подтверждений:
        при первом success сервер ждёт второго, при втором меняет
        владельцев товаров и закрывает конкурирующие предложения по тем
        же вещам. Для failed достаточно одной стороны — тот, кто приехал
        впустую, не должен зависеть от согласия второй.
      parameters:
      - description: Exchange ID (совпадает с ID предложения)
        in: path
        name: exchangeID
        required: true
        type: string
      - description: Итог встречи
        in: body
