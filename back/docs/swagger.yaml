  /exchange-offers:
    get:
      description: |-
        Предложения текущего пользователя. Без параметров возвращает
        обе стороны и все состояния.
      parameters:
      - description: Сторона
        enum:
        - incoming
        - outgoing
        in: query
        name: role
        type: string
      - description: Состояния через запятую
        enum:
        - pending
        - accepted
        - declined
        - cancelled
        - expired
        - completed
        - failed
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/httpapi.OfferResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "401":
          description: unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: Входящие и исходящие предложения
      tags:
      - exchange-offers
    post:
      consumes:
      - application/json
      description: |-
        Двустороннее предложение владельцу запрошенного товара. Сервер
        проверяет, что оба товара активны, принадлежат разным людям и
        инициатор владеет предложенным. Поле exchange_goal_id
        необязательно: без него это прямой обмен из карточки товара.
        Повторное предложение по той же паре товаров отдаёт 409.
      parameters:
      - description: Предложение
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httpapi.CreateOfferRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/httpapi.CreatedOfferResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "401":
          description: unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      summary: Отправить предложение обмена
      tags:
      - exchange-offers
  /exchange-offers/{offerID}:
    get:
      description: |-
        Карточка предложения целиком. Доступна только его сторонам:
        внутри переписка о встрече.
      parameters:
      - description: Offer ID
        in: path
        name: offerID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
