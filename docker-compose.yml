services:

  postgres:
    image: postgres:16-alpine
    container_name: trade-chain-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-trade_chain}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      # test_case.sql намеренно не монтируется: он очищает БД и предназначен
      # только для ручного тестирования, а не для стартового набора mock API.
      - ./back/infrastructure/migrations/001_create_tables.sql:/docker-entrypoint-initdb.d/001_create_tables.sql:ro
      - ./back/infrastructure/migrations/002_create_search_extension.sql:/docker-entrypoint-initdb.d/002_create_search_extension.sql:ro
      - ./back/infrastructure/migrations/003_align_schema_with_domain.sql:/docker-entrypoint-initdb.d/003_align_schema_with_domain.sql:ro
      - ./back/infrastructure/migrations/004_exchange_negotiation.sql:/docker-entrypoint-initdb.d/004_exchange_negotiation.sql:ro
      - ./back/infrastructure/migrations/005_exchange_offer_details.sql:/docker-entrypoint-initdb.d/005_exchange_offer_details.sql:ro
      - ./back/infrastructure/migrations/006_seed_mock_data.sql:/docker-entrypoint-initdb.d/006_seed_mock_data.sql:ro
      - ./back/infrastructure/migrations/007_category_goal.sql:/docker-entrypoint-initdb.d/007_category_goal.sql:ro
      - ./back/infrastructure/migrations/008_unavailable_chain_status.sql:/docker-entrypoint-initdb.d/008_unavailable_chain_status.sql:ro
      - ./back/infrastructure/migrations/010_notification_reads.sql:/docker-entrypoint-initdb.d/010_notification_reads.sql:ro
      - ./back/infrastructure/migrations/011_customer_full_name.sql:/docker-entrypoint-initdb.d/011_customer_full_name.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5



  app:
    build:
      context: ./back
      dockerfile: Dockerfile

    container_name: trade-chain-back
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-trade_chain}?sslmode=disable
      PORT: 8080
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required and must contain at least 32 characters}
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
      # Вход выбором участника из списка — ход ради демонстрации: чтобы увидеть
      # обмен, нужны две стороны с товарами и историей, а пустой свежий аккаунт
      # не показывает ничего. Пароль при таком входе не спрашивается, поэтому
      # флаг явный и в боевом окружении просто не выставляется.
      DEMO_LOGIN_ENABLED: ${DEMO_LOGIN_ENABLED:-true}

    ports:
      - "8080:8080"



  front:
    build:
      context: ./front
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080

    container_name: trade-chain-front

    depends_on:
      - app

    ports:
      - "3000:80"
  fmt:
    profiles:
      - check
    image: golangci/golangci-lint:v2.12.2-alpine
    working_dir: /app
    volumes:
      - ./back:/app
    command: golangci-lint fmt ./...

  lint:
    profiles:
      - check
    image: golangci/golangci-lint:v2.12.2-alpine
    working_dir: /app
    volumes:
      - ./back:/app
      - golangci_cache:/root/.cache/golangci-lint
    command: golangci-lint run ./...

  test:
    profiles:
      - check
    image: golang:1.26-alpine
    working_dir: /app
    volumes:
      - ./back:/app
      - go_cache:/go
    command: go test ./...

volumes:
  postgres_data:
  golangci_cache:
  go_cache:
